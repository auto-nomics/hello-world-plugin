schema_version = 1
plugin_name = "hello-world"
status = "validating"
panels = []

[installation]

[lifecycle]
request_ids = ["R-bd10d02cd5386e2d"]
rationale = "Create the canonical fork-and-update reference plugin."
latest_report = ".rsi/reports/attempt-1.json"

[image]
reference = "docker.io/library/alpine@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507"

[[nodes]]
kind = "hello_world"
desc = "Wraps one greeting input as the canonical Autonomics hello output."
doc = "Input 0 is a UTF-8 text greeting. The node writes one deterministic UTF-8 file containing Hello, <greeting>!."
deprecated = false
timeout_secs = 3600

[[nodes.ports.inputs]]
type = "file"
label = "greeting"
accepted_formats = ["txt"]

[[nodes.ports.outputs]]
path = "hello.txt"
format = "txt"

[nodes.params]

[nodes.command]
interpreter = "sh"
script_file = "scripts/hello_world.sh"

[nodes.resources]
read_only_rootfs = true
